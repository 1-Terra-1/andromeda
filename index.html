<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Andromeda</title>
<style>
  html, body { margin: 0; height: 100%; background: #04020b; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; }
  #clock {
    position: fixed; left: 0; right: 0; bottom: 5vh; text-align: center;
    font: 600 14px/1.4 "Cascadia Mono", Consolas, "Courier New", monospace;
    color: #b9a3ff; letter-spacing: 0.3em; text-shadow: 0 0 10px #5a2cff;
    user-select: none; pointer-events: none;
  }
  #clock .t { font-size: 36px; color: #f1ebff; letter-spacing: 0.15em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="clock"><div class="t"></div><div class="d"></div></div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  // dense ramp: from almost empty to full glyphs
  const RAMP = " .'`^,:;-~=+<>il!?*%xzcvunrjft1oeaskhdbpqwmZO0QXEHNWM#&@";
  const L = RAMP.length;
  const FONT_SIZE = 10;
  let cols, rows, cw, ch, W, H, dpr, stars, glowCv, glowCtx, glowImg, glow2, glow2Ctx, grid, gridCol;

  // ---------- value noise (tileable, 4 octaves) ----------
  const N = 256, noise = new Float32Array(N * N);
  { const base = new Float32Array(N * N).map(() => Math.random());
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      let s = 0, a = 1, tot = 0;
      for (let o = 0; o < 5; o++) {
        const step = 64 >> o;
        const x0 = Math.floor(x / step) * step, y0 = Math.floor(y / step) * step;
        let fx = (x - x0) / step, fy = (y - y0) / step;
        fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
        const g = (xx, yy) => base[((yy % N) * N) + (xx % N)];
        const v = g(x0, y0) * (1 - fx) * (1 - fy) + g(x0 + step, y0) * fx * (1 - fy)
                + g(x0, y0 + step) * (1 - fx) * fy + g(x0 + step, y0 + step) * fx * fy;
        s += v * a; tot += a; a *= 0.55;
      }
      noise[y * N + x] = s / tot;
    } }
  const nz = (x, y) => {
    x = ((x % N) + N) % N; y = ((y % N) + N) % N;
    const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0;
    const x1 = (x0 + 1) % N, y1 = (y0 + 1) % N;
    return noise[y0 * N + x0] * (1 - fx) * (1 - fy) + noise[y0 * N + x1] * fx * (1 - fy)
         + noise[y1 * N + x0] * (1 - fx) * fy + noise[y1 * N + x1] * fx * fy;
  };

  // ---------- star clusters / HII knots fixed in the disk frame ----------
  const knots = Array.from({ length: 260 }, () => {
    const r = 0.22 + Math.random() * 0.6, a = Math.random() * Math.PI * 2;
    return { r, a, s: 0.006 + Math.random() * 0.018, b: 0.3 + Math.random() * 0.7,
             blue: Math.random() < 0.65 };
  });

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `600 ${FONT_SIZE}px "Cascadia Mono", Consolas, "Courier New", monospace`;
    ctx.textBaseline = 'top';
    cw = ctx.measureText('M').width; ch = FONT_SIZE * 1.12;
    cols = Math.ceil(W / cw); rows = Math.ceil(H / ch);
    grid = new Float32Array(cols * rows);
    gridCol = new Float32Array(cols * rows * 3);
    glowCv = document.createElement('canvas');
    glowCv.width = cols; glowCv.height = rows;
    glowCtx = glowCv.getContext('2d');
    glowImg = glowCtx.createImageData(cols, rows);
    glow2 = document.createElement('canvas');
    glow2.width = Math.max(1, cols >> 3); glow2.height = Math.max(1, rows >> 3);
    glow2Ctx = glow2.getContext('2d');
    stars = Array.from({ length: Math.floor(cols * rows * 0.006) }, () => ({
      i: Math.random() * cols | 0, j: Math.random() * rows | 0,
      p: Math.random() * 6.28, s: 0.4 + Math.random() * 1.8, b: Math.pow(Math.random(), 2)
    }));
  }
  addEventListener('resize', resize); resize();

  const PA = -0.5, cosPA = Math.cos(PA), sinPA = Math.sin(PA);
  const TILT = 0.3;
  const PITCH = 8.5;
  const styleCache = new Map();
  const style = (r, g, b) => {
    const key = ((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3);
    let s = styleCache.get(key);
    if (!s) { s = `rgb(${(r >> 3) << 3},${(g >> 3) << 3},${(b >> 3) << 3})`; styleCache.set(key, s); }
    return s;
  };

  let last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (now - last < 45) return; // ~22 fps, plenty for a slow rotation
    last = now;
    const t = now / 1000;
    const rot = t * 0.03;
    const cosR = Math.cos(-rot), sinR = Math.sin(-rot);

    const R = Math.min(W * 0.48, H * 0.88);
    const cx = W / 2, cy = H * 0.46;
    grid.fill(0); gridCol.fill(0);

    // ---- 1) compute brightness + colour per cell ----
    for (let j = 0; j < rows; j++) {
      const py = j * ch + ch / 2 - cy;
      for (let i = 0; i < cols; i++) {
        const px = i * cw + cw / 2 - cx;
        const x = (px * cosPA + py * sinPA) / R;
        const y = (-px * sinPA + py * cosPA) / R / TILT;
        const r2 = x * x + y * y;
        const rb = Math.hypot(x, y * TILT / 0.6);           // roundish bulge
        if (r2 > 1.3 && rb > 0.5) continue;
        const r = Math.sqrt(r2);
        // rotate into the disk's own frame
        const xr = x * cosR - y * sinR, yr = x * sinR + y * cosR;
        const th = Math.atan2(yr, xr);
        const lr = Math.log(r + 0.03);
        const ph = 2 * th - PITCH * lr;

        const n1 = nz(xr * 55 + 128, yr * 55 + 128);
        const n2 = nz(xr * 140 + 30, yr * 140 + 70);
        const n3 = nz(xr * 300 + 200, yr * 300 + 10);

        // disk components
        const arm = Math.pow(0.5 + 0.5 * Math.cos(ph + 0.6 * (n1 - 0.5) * 6), 1.6);
        const ring = Math.exp(-Math.pow((r - 0.58) / 0.12, 2)) * (0.7 + 0.6 * n2);
        const disk = 0.6 * Math.exp(-r / 0.4) * (0.35 + 0.8 * arm + 0.6 * ring) * (0.4 + 1.1 * n1) * (0.8 + 0.4 * n3);
        const bulge = 1.3 * Math.exp(-rb * rb / 0.0015) + 0.8 * Math.exp(-rb / 0.075) + 0.2 * Math.exp(-rb / 0.2);
        // dust lanes, much stronger on the near (upper) side
        const near = y < 0 ? 1 : 0.4;
        const lane = Math.pow(0.5 + 0.5 * Math.cos(ph + 1.5 + (n2 - 0.5) * 3), 3.5);
        const dust = lane * near * Math.min(1, Math.max(0, (r - 0.1) * 6)) * (0.5 + 0.8 * n2);
        const edge = Math.max(0, 1 - Math.pow(r / 1.1, 5));

        let b = (disk * (1 - 0.92 * Math.min(1, dust)) * edge + bulge * (1 - 0.35 * Math.min(1, dust) * (rb > 0.04 ? 1 : 0)));
        if (b < 0.035) continue;

        // colour: golden core -> cream inner disk -> blue-violet outer disk, brownish in dust
        const cCore = Math.min(1, bulge / (bulge + disk + 1e-4));
        const cOut = Math.min(1, Math.max(0, (r - 0.35) * 1.4));
        let cr = 255 * cCore + (1 - cCore) * (225 * (1 - cOut) + 120 * cOut);
        let cg = 214 * cCore + (1 - cCore) * (200 * (1 - cOut) + 150 * cOut);
        let cb = 160 * cCore + (1 - cCore) * (235 * (1 - cOut) + 255 * cOut);
        const d = Math.min(1, dust) * 0.5;
        cr = cr * (1 - d) + 170 * d; cg = cg * (1 - d) + 110 * d; cb = cb * (1 - d) + 90 * d;

        const k = j * cols + i;
        grid[k] = b;
        gridCol[k * 3] = cr; gridCol[k * 3 + 1] = cg; gridCol[k * 3 + 2] = cb;
      }
    }

    // star-forming knots (blue clusters / pink HII) riding the disk
    for (const kn of knots) {
      const a = kn.a + rot;
      const gx = kn.r * Math.cos(a), gy = kn.r * Math.sin(a) * TILT;
      const sx = cx + (gx * cosPA - gy * sinPA) * R, sy = cy + (gx * sinPA + gy * cosPA) * R;
      const i = (sx / cw) | 0, j = (sy / ch) | 0;
      if (i < 0 || j < 0 || i >= cols || j >= rows) continue;
      const k = j * cols + i;
      if (grid[k] < 0.08) continue;
      grid[k] += kn.b * 0.5;
      if (kn.blue) { gridCol[k * 3] = 170; gridCol[k * 3 + 1] = 200; gridCol[k * 3 + 2] = 255; }
      else { gridCol[k * 3] = 255; gridCol[k * 3 + 1] = 140; gridCol[k * 3 + 2] = 200; }
    }

    // ---- 2) soft glow layer underneath (low-res image, blurred & upscaled) ----
    const px = glowImg.data;
    for (let k = 0, n = cols * rows; k < n; k++) {
      const g = Math.min(1, grid[k] * 0.55);
      px[k * 4] = gridCol[k * 3] * g; px[k * 4 + 1] = gridCol[k * 3 + 1] * g;
      px[k * 4 + 2] = gridCol[k * 3 + 2] * g; px[k * 4 + 3] = 255;
    }
    glowCtx.putImageData(glowImg, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#04020b'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    glow2Ctx.drawImage(glowCv, 0, 0, glow2.width, glow2.height);   // downsample = cheap blur
    ctx.globalAlpha = 0.5;
    ctx.drawImage(glowCv, 0, 0, cols * cw, rows * ch);
    ctx.globalAlpha = 0.7;
    ctx.drawImage(glow2, 0, 0, cols * cw, rows * ch);
    ctx.globalAlpha = 1;

    // ---- 3) ASCII glyphs on top ----
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const k = j * cols + i, b = grid[k];
        if (b <= 0) continue;
        const bb = Math.min(1, Math.pow(b, 0.8));
        const idx = Math.min(L - 1, Math.floor(bb * L));
        if (idx === 0) continue;
        const lum = 0.45 + 0.55 * bb;
        ctx.fillStyle = style(Math.min(255, gridCol[k * 3] * lum) | 0,
                              Math.min(255, gridCol[k * 3 + 1] * lum) | 0,
                              Math.min(255, gridCol[k * 3 + 2] * lum) | 0);
        ctx.fillText(RAMP[idx], i * cw, j * ch);
      }
    }

    // ---- 4) foreground twinkling stars ----
    for (const s of stars) {
      if (grid[s.j * cols + s.i] > 0.15) continue;
      const tw = 0.5 + 0.5 * Math.sin(t * s.s + s.p);
      const v = 0.2 + 0.8 * tw * (0.3 + 0.7 * s.b);
      const g = s.b > 0.75 && tw > 0.85 ? '*' : s.b > 0.4 && tw > 0.5 ? '+' : '.';
      const c = (60 + 195 * v) | 0;
      ctx.fillStyle = style(c, c, Math.min(255, c + 20));
      ctx.fillText(g, s.i * cw, s.j * ch);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  requestAnimationFrame(frame);

  // clock
  const tEl = document.querySelector('#clock .t'), dEl = document.querySelector('#clock .d');
  function tick() {
    const d = new Date();
    tEl.textContent = d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    dEl.textContent = d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }).toUpperCase();
  }
  tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
